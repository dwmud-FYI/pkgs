name: publish

# Manifest-driven CD: a change to manifest.json (a new package version) rebuilds the
# whole repo tree into a fresh nginx image and rolls it out. workflow_dispatch covers
# re-publishes (key rotation, nginx tweaks) without a manifest change.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: dwmud
    # backstop: a stalled ghcr push used to hang this step forever (no timeout).
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dwmud-fyi/dwmud-pkgs
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to dhi.io
        run: echo "${{ secrets.DHI_TOKEN }}" | docker login dhi.io -u "${{ secrets.DHI_USERNAME }}" --password-stdin

      # the signing key reaches the build as a BuildKit secret — present only during
      # the RUN that needs it, absent from every layer and from the final image.
      - name: Build and push
        run: |
          umask 077
          printf '%s\n' "${{ secrets.GPG_PRIVATE_KEY }}" > /tmp/gpgkey.asc
          DOCKER_BUILDKIT=1 docker build \
            --secret id=gpgkey,src=/tmp/gpgkey.asc \
            -t "$IMAGE:${{ github.run_number }}" -t "$IMAGE:latest" .
          rm -f /tmp/gpgkey.asc
          # ghcr push intermittently stalls after uploading layers (hangs with no
          # output). timeout + retry so a stuck connection is killed and re-tried
          # instead of hanging the whole job.
          for tag in "${{ github.run_number }}" latest; do
              n=0
              until timeout 300 docker push "$IMAGE:$tag"; do
                  n=$((n + 1))
                  [ "$n" -ge 4 ] && { echo "push of $tag failed after $n attempts"; exit 1; }
                  echo "push of $tag stalled/failed; retry $n in 15s"
                  sleep 15
              done
          done

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Roll out
        run: |
          kubectl -n dwmud set image deployment/dwmud-pkgs \
            pkgs="$IMAGE:${{ github.run_number }}"
          kubectl -n dwmud rollout status deployment/dwmud-pkgs --timeout=180s

  # Keep the AUR listing in step with the same PKGBUILD that built the binary repo.
  # Idempotent — identical PKGBUILD/.SRCINFO on the AUR means no push. Gated behind
  # build-push so a broken repo build never advances the AUR either.
  #
  # Runs on GitHub-hosted (free for public repos), NOT the cluster runners: the job
  # needs no cluster access, and the AUR's edge fights the DinD container network on
  # the ARC runners (https resets, ssh hangs) while hosted egress works fine.
  aur-publish:
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # the key file must live under the _work volume (RUNNER_TEMP), not /tmp — docker
      # bind mounts resolve on the DinD daemon's filesystem, and only _work is shared
      # between the runner container and the daemon sidecar. A /tmp path silently
      # mounts as an empty directory instead.
      - name: Push PKGBUILDs to AUR
        run: |
          # the trailing newline is load-bearing: OpenSSH refuses a PEM whose END line
          # isn't newline-terminated ("error in libcrypto: unsupported")
          umask 077
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > "$RUNNER_TEMP/aur_key"
          # one AUR package per arch entry in the manifest — so a package reaches the
          # AUR on the same commit that activates its pacman build, not before.
          for pkg in $(jq -r '.artifacts[] | select(.type=="arch") | .package' manifest.json | sort -u); do
              echo "::group::AUR $pkg"
              AUR_KEY_FILE="$RUNNER_TEMP/aur_key" ./scripts/publish-aur.sh "$pkg"
              echo "::endgroup::"
          done
          rm -f "$RUNNER_TEMP/aur_key"
