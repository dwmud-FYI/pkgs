name: publish

# Manifest-driven CD: a change to manifest.json (a new package version) rebuilds the
# whole repo tree into a fresh nginx image and rolls it out. workflow_dispatch covers
# re-publishes (key rotation, nginx tweaks) without a manifest change.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: dwmud
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dwmud-fyi/dwmud-pkgs
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to dhi.io
        run: echo "${{ secrets.DHI_TOKEN }}" | docker login dhi.io -u "${{ secrets.DHI_USERNAME }}" --password-stdin

      # the signing key reaches the build as a BuildKit secret — present only during
      # the RUN that needs it, absent from every layer and from the final image.
      - name: Build and push
        run: |
          umask 077
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" > /tmp/gpgkey.asc
          DOCKER_BUILDKIT=1 docker build \
            --secret id=gpgkey,src=/tmp/gpgkey.asc \
            -t "$IMAGE:${{ github.run_number }}" -t "$IMAGE:latest" .
          rm -f /tmp/gpgkey.asc
          docker push "$IMAGE:${{ github.run_number }}"
          docker push "$IMAGE:latest"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Roll out
        run: |
          kubectl -n dwmud set image deployment/dwmud-pkgs \
            pkgs="$IMAGE:${{ github.run_number }}"
          kubectl -n dwmud rollout status deployment/dwmud-pkgs --timeout=180s

  # Keep the AUR listing in step with the same PKGBUILD that built the binary repo.
  # Idempotent — identical PKGBUILD/.SRCINFO on the AUR means no push. Gated behind
  # build-push so a broken repo build never advances the AUR either.
  aur-publish:
    runs-on: dwmud
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Push PKGBUILD to AUR
        run: |
          umask 077
          printf '%s' "${{ secrets.AUR_SSH_KEY }}" > /tmp/aur_key
          AUR_KEY_FILE=/tmp/aur_key ./scripts/publish-aur.sh luggage-desktop
          rm -f /tmp/aur_key
