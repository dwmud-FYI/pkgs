server {
    # DHI nginx runs nonroot and cannot bind 80
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # package pools + dists are nice to browse by hand
    autoindex on;

    # apt/dnf/pacman fetch metadata constantly; packages are immutable once published.
    # Short cache on metadata so a new release propagates fast, long on pool files.
    location ~ ^/apt/dists/ {
        add_header Cache-Control "public, max-age=120";
    }
    location ~ ^/arch/dwmud\.(db|files)(\.sig)?$ {
        add_header Cache-Control "public, max-age=120";
    }
    location ~ \.(deb|rpm|pkg\.tar\.zst)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
